name: Build AI Pro Camera APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || {
            echo "## ❌ Build Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ./gradlew assembleDebug --no-daemon 2>&1 | grep -A 10 -B 2 -E "(FAILED|error:|Exception)" | head -n 40 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIProCamera-debug
          path: app/build/outputs/apk/debug/app-debug.apk
